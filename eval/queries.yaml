# explicit_historical_version (5) — mirrors the five superseded pairs above,
# same topics, but the query names the old RFC on purpose. Gold and
# distractor are swapped relative to the matching superseded query: the
# obsoleted section is now correct, and the current one must not override it.
# ---------------------------------------------------------------------------

- id: q037
  query: "In RFC 7540, what does the GOAWAY frame allow an HTTP/2 endpoint to do?"
  category: explicit_historical_version
  difficulty: hard
  gold_sections:
    - {rfc: 7540, section: "6.8"}
  gold_documents: [7540]
  reference_answer: "Initiate shutdown of a connection (or signal a serious error condition), gracefully stopping acceptance of new streams while finishing in-flight ones."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 9113, section: "6.8"}
  notes: "Mirrors q032. A validity filter tuned only to prefer current-by-default must not suppress RFC 7540 here, since the query names it explicitly."

- id: q038
  query: "In RFC 7230, what ABNF extension does the specification add for defining comma-separated lists?"
  category: explicit_historical_version
  difficulty: hard
  gold_sections:
    - {rfc: 7230, section: "1.2"}
  gold_documents: [7230]
  reference_answer: "A list extension using a '#' operator, alongside the base ABNF notation from RFC 5234."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 9110, section: "2.1"}
  notes: "Mirrors q033."

- id: q039
  query: "In RFC 2616, how does chunked transfer coding structure the body of a message?"
  category: explicit_historical_version
  difficulty: medium
  gold_sections:
    - {rfc: 2616, section: "3.6.1"}
  gold_documents: [2616]
  reference_answer: "As a series of chunks, each with its own size indicator, followed by an optional trailer containing entity-header fields."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 9112, section: "7.1.3"}
  notes: "Mirrors q034."

- id: q040
  query: "In RFC 2616, what does the Last-Modified header field indicate, and what format is its value?"
  category: explicit_historical_version
  difficulty: easy
  gold_sections:
    - {rfc: 2616, section: "14.29"}
  gold_documents: [2616]
  reference_answer: "The date and time at which the origin server believes the variant was last modified. Its value is an HTTP-date."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 9110, section: "8.8.2"}
  notes: "Mirrors q035."

- id: q041
  query: "In RFC 2616, what header field tells a client how long to wait before retrying, and what two formats can its value take?"
  category: explicit_historical_version
  difficulty: medium
  gold_sections:
    - {rfc: 2616, section: "14.37"}
  gold_documents: [2616]
  reference_answer: "Retry-After. Its value is either an HTTP-date or a number of seconds to delay."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 9110, section: "10.2.3"}
  notes: "Mirrors q036."
