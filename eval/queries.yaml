# C2 result, since C2 does not exist yet. See README.md Evaluation Dataset.

- id: q027
  query: "What frame type value identifies a WINDOW_UPDATE frame in HTTP/2?"
  category: identifier_lookup
  difficulty: hard
  gold_sections:
    - {rfc: 9113, section: "6.9"}
  gold_documents: [9113]
  reference_answer: "Type=0x08."
  expected_behaviour: answer

- id: q028
  query: "What frame type value identifies a GOAWAY frame in HTTP/2?"
  category: identifier_lookup
  difficulty: hard
  gold_sections:
    - {rfc: 9113, section: "6.8"}
  gold_documents: [9113]
  reference_answer: "Type=0x07."
  expected_behaviour: answer

- id: q029
  query: "What is the hex identifier for the SETTINGS_QPACK_MAX_TABLE_CAPACITY setting, and what is its default value?"
  category: identifier_lookup
  difficulty: hard
  gold_sections:
    - {rfc: 9204, section: "5"}
  gold_documents: [9204]
  reference_answer: "0x01. The default value is zero."
  expected_behaviour: answer

- id: q030
  query: "What error code value indicates QPACK_DECOMPRESSION_FAILED?"
  category: identifier_lookup
  difficulty: hard
  gold_sections:
    - {rfc: 9204, section: "6"}
  gold_documents: [9204]
  reference_answer: "0x0200."
  expected_behaviour: answer

- id: q031
  query: "What frame type value identifies a HEADERS frame in HTTP/3?"
  category: identifier_lookup
  difficulty: hard
  gold_sections:
    - {rfc: 9114, section: "7.2.2"}
  gold_documents: [9114]
  reference_answer: "Type=0x01."
  expected_behaviour: answer

# ---------------------------------------------------------------------------
# multi_section (8) — evidence genuinely needs two sections
# ---------------------------------------------------------------------------

- id: q019
  query: "How does the meaning of the max-age directive differ depending on whether it appears in a request or a response?"
  category: multi_section
  difficulty: hard
  gold_sections:
    - {rfc: 9111, section: "5.2.1.1"}
    - {rfc: 9111, section: "5.2.2.1"}
  gold_documents: [9111]
  reference_answer: "As a request directive, max-age says the client wants a response no older than the given number of seconds. As a response directive, max-age says the response should be considered stale once it is older than that."
  expected_behaviour: answer
  notes: "Same directive name, same document, two different sections with genuinely different meanings depending on message direction."

- id: q020
  query: "In what two distinct ways can an HTTP/3 connection end - one initiated by the application, one by the transport - and how do they differ for the client afterward?"
  category: multi_section
  difficulty: hard
  gold_sections:
    - {rfc: 9114, section: "5.3"}
    - {rfc: 9114, section: "5.4"}
  gold_documents: [9114]
  reference_answer: "Immediate application closure: the implementation itself closes the QUIC connection deliberately, sending a CONNECTION_CLOSE frame. Transport closure: the QUIC transport reports termination to the application for reasons outside its control (peer closure, transport error, network change); if this happens without a prior GOAWAY frame, clients must assume any in-flight request might already have been processed."
  expected_behaviour: answer
  notes: "Reworded after both configurations missed this entirely (rank 66 and
    316 for the two gold sections, dense-only). The original wording asked
    for the two ways 'the transport layer' can end - but section 5.3 is about
    the *application* deciding to close, not the transport, so the query's
    own framing pulled toward 5.4 and away from 5.3. Kept as a documented
    example of a query-wording bias rather than a pure retrieval failure -
    see README.md Error Analysis."

- id: q021
  query: "Under what condition can a client safely retry a request automatically after a connection closes, and which methods satisfy it by default?"
  category: multi_section
  difficulty: hard
  gold_sections:
    - {rfc: 9112, section: "9.3.1"}
    - {rfc: 9110, section: "9.2.2"}
  gold_documents: [9112, 9110]
  reference_answer: "A request can be safely retried automatically if its method is idempotent - repeating it has the same effect as sending it once. PUT, DELETE and the safe methods are idempotent by default."
  expected_behaviour: answer
  notes: "9112 section 9.3.1 explicitly defers the actual criterion to section 9.2.2 of [HTTP] - a genuine cross-document reference, not an invented pairing."

- id: q022
  query: "What happens to HTTP/2 throughput if an endpoint doesn't keep enough flow-control window available for its peer?"
  category: multi_section
  difficulty: medium
  gold_sections:
    - {rfc: 9113, section: "5.2"}
    - {rfc: 9113, section: "5.2.3"}
  gold_documents: [9113]
  reference_answer: "Flow control exists to stop streams from destructively interfering with each other over the shared connection; but if an endpoint fails to keep the window larger than the bandwidth-delay product, receive throughput is limited by flow control itself, degrading performance. Sending timely WINDOW_UPDATE frames improves it."
  expected_behaviour: answer

- id: q023
  query: "How is the size of an entry in HPACK's dynamic table calculated, given that the dynamic table indexes header fields?"
  category: multi_section
  difficulty: hard
  gold_sections:
    - {rfc: 7541, section: "2.3"}
    - {rfc: 7541, section: "4.1"}
  gold_documents: [7541]
  reference_answer: "The dynamic table (introduced alongside the static table for indexing header fields) holds entries whose size is the sum of the name's length in octets, the value's length in octets, and 32 additional octets - calculated on the unencoded name and value, without any Huffman encoding applied."
  expected_behaviour: answer

- id: q024
  query: "How do QPACK's static and dynamic tables differ in how their entries are indexed and how long entries persist?"
  category: multi_section
  difficulty: hard
  gold_sections:
    - {rfc: 9204, section: "3.1"}
    - {rfc: 9204, section: "3.2"}
  gold_documents: [9204]
  reference_answer: "The static table is a predefined list with a fixed index over time, indexed from 0. The dynamic table is a first-in-first-out list the encoder and decoder build up together, starting empty, and can contain duplicate entries."
  expected_behaviour: answer

- id: q025
  query: "Both the Secure and HttpOnly cookie attributes restrict a cookie's scope - restrict it to what, respectively, and are the two independent of each other?"
  category: multi_section
  difficulty: medium
  gold_sections:
    - {rfc: 6265, section: "4.1.2.5"}
    - {rfc: 6265, section: "4.1.2.6"}
  gold_documents: [6265]
  reference_answer: "Secure restricts a cookie to secure (e.g. TLS) channels. HttpOnly restricts a cookie to HTTP requests, hiding it from non-HTTP APIs like browser scripts. They are independent - a cookie can carry either, both, or neither."
  expected_behaviour: answer

- id: q026
  query: "400 Bad Request and 404 Not Found are both client-error status codes - what is the actual difference in what each one tells the client?"
  category: multi_section
  difficulty: medium
  gold_sections:
    - {rfc: 9110, section: "15.5.1"}
    - {rfc: 9110, section: "15.5.5"}
  gold_documents: [9110]
  reference_answer: "400 means the server perceives an error in the request itself (malformed syntax, invalid framing, deceptive routing). 404 means the request was understood but the origin server found no current representation for the target resource, or won't disclose that one exists."
  expected_behaviour: answer

# ---------------------------------------------------------------------------
# superseded (5) — answerable from both a current and an obsoleted RFC;
# only the current answer is correct. No RFC number named in the query, so
# the trap is exactly "assume current unless told otherwise". Built from five
# topic pairs verified against the real corpus text on both sides - not
# assumed to be near-duplicates, checked.
# ---------------------------------------------------------------------------

- id: q032
  query: "What does the GOAWAY frame allow an HTTP/2 endpoint to do?"
  category: superseded
  difficulty: hard
  gold_sections:
    - {rfc: 9113, section: "6.8"}
  gold_documents: [9113]
  reference_answer: "Initiate shutdown of a connection (or signal a serious error condition), gracefully stopping acceptance of new streams while finishing in-flight ones."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 7540, section: "6.8"}
  notes: "RFC 7540 defines the same frame in nearly identical wording (even the same frame-type value, 0x07/0x7) - a near-duplicate obsoleted competitor, not a distractor invented for difficulty."

- id: q033
  query: "What ABNF extension does the HTTP semantics specification add for defining comma-separated lists?"
  category: superseded
  difficulty: hard
  gold_sections:
    - {rfc: 9110, section: "2.1"}
  gold_documents: [9110]
  reference_answer: "A list extension using a '#' operator, alongside the base ABNF notation from RFC 5234."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 7230, section: "1.2"}
  notes: "RFC 7230's Syntax Notation section describes essentially the same '#' list extension in near-identical wording."

- id: q034
  query: "How does chunked transfer coding structure the body of a message?"
  category: superseded
  difficulty: medium
  gold_sections:
    - {rfc: 9112, section: "7.1.3"}
  gold_documents: [9112]
  reference_answer: "As a series of chunks, each with its own size indicator, optionally followed by a trailer section."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 2616, section: "3.6.1"}
  notes: "RFC 2616 describes the same chunked-body structure; the current text is framed as a decoding algorithm rather than a definition, a smaller wording difference than the other pairs in this category."

- id: q035
  query: "What does the Last-Modified header field indicate, and what format is its value?"
  category: superseded
  difficulty: easy
  gold_sections:
    - {rfc: 9110, section: "8.8.2"}
  gold_documents: [9110]
  reference_answer: "A timestamp for when the origin server believes the representation was last modified. Its value is an HTTP-date."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 2616, section: "14.29"}
  notes: "RFC 2616's definition is nearly word-for-word the same, including the HTTP-date format."

- id: q036
  query: "What header field tells a client how long to wait before retrying, and what two formats can its value take?"
  category: superseded
  difficulty: medium
  gold_sections:
    - {rfc: 9110, section: "10.2.3"}
  gold_documents: [9110]
  reference_answer: "Retry-After. Its value is either an HTTP-date or a number of delay-seconds."
  expected_behaviour: answer
  distractor_sections:
    - {rfc: 2616, section: "14.37"}
  notes: "The same query used earlier in this file's schema documentation (q017's original, now-fixed slot) - kept here as the actual superseded-category instance it always should have been, now with a verified distractor."

